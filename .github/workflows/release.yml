# v から始まるタグ（例: v1.0.0）を push すると、macOS / Windows 版アプリをビルドして
# GitHub Releases に「下書き」として添付する。中身を確認してから手動で公開する。
name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin # Intel / Apple シリコン両対応
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Xmas BINGO ${{ github.ref_type == ''tag'' && github.ref_name || ''v__VERSION__'' }}'
          releaseBody: |
            社内パーティ用 3D クリスマスビンゴ。インストール方法は INSTALL.md を参照してください。
            - macOS: `Xmas.BINGO_*_universal.dmg`
            - Windows: `Xmas.BINGO_*_x64-setup.exe`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
