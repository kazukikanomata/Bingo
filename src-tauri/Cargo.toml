[package]
name = "xmas-bingo"
version = "1.0.0"
description = "3D Christmas BINGO"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xmas_bingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
